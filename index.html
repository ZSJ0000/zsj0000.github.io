<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 生成 Minecraft 插件</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#172033;font-family:Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:650px;margin:50px auto;padding:28px;background:#fff;border-radius:16px;box-shadow:0 10px 35px #0001}h1{text-align:center;font-size:26px}label{display:block;font-weight:700;margin:16px 0 7px}select,input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}textarea{height:145px;resize:vertical}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer}button:disabled{background:#94a3b8}.status{text-align:center;margin-top:18px;min-height:25px}.result{display:none;margin-top:20px;padding:16px;background:#f0fdf4;border:1px solid #86efac;border-radius:8px}.result a{color:#166534;font-weight:bold}.hint{color:#64748b;font-size:13px}</style></head><body><main class="wrap"><h1>AI 生成 Minecraft 插件</h1><form id="form"><label>Minecraft 版本</label><select id="version"><option>1.21.8</option><option>1.21.7</option><option>1.21.6</option><option>1.21.5</option><option>1.21.4</option><option>1.20.6</option><option>1.20.1</option></select><label>服务端类型</label><select id="server"><option value="paper">Paper</option><option value="spigot">Spigot</option><option value="purpur">Purpur</option></select><label>插件名称</label><input id="name" required placeholder="例如：ZombieReward"><div class="hint">只能使用字母、数字、下划线或短横线</div><label>插件描述</label><textarea id="desc" required placeholder="例如：玩家击杀10只僵尸后获得5个钻石"></textarea><button id="submit">生成插件 ZIP</button></form><div class="status" id="status"></div><div class="result" id="result">插件项目已生成：<a id="download" download>下载 ZIP 文件</a></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script>const $=x=>document.getElementById(x);$('form').onsubmit=async e=>{e.preventDefault();let n=$('name').value.trim(),d=$('desc').value.trim(),v=$('version').value,s=$('server').value;if(!/^[A-Za-z0-9_-]+$/.test(n)){ $('status').textContent='插件名称格式不正确';return}$('submit').disabled=true;$('status').textContent='正在创建插件项目文件...';let p=n.toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/^\.|\.$/g,'')||'generated.plugin',c=n.replace(/[^A-Za-z0-9]/g,'')||'GeneratedPlugin',f={'settings.gradle':`rootProject.name = '${n}'\n`,'build.gradle':`plugins { id 'java' }\ngroup = '${p}'\nversion = '1.0.0'\nrepositories { mavenCentral(); maven { url = 'https://repo.papermc.io/repository/maven-public/' } }\ndependencies { compileOnly 'io.papermc.paper:paper-api:${v}-R0.1-SNAPSHOT' }\njava { toolchain.languageVersion = JavaLanguageVersion.of(21) }\n`,'src/main/resources/plugin.yml':`name: ${n}\nversion: 1.0.0\nmain: ${p}.${c}\napi-version: '1.21'\nauthor: AI Generator\ndescription: ${d.replace(/\n/g,' ')}\n`,'src/main/java/'+p.replace(/\./g,'/')+'/'+c+'.java':`package ${p};\nimport org.bukkit.plugin.java.JavaPlugin;\npublic class ${c} extends JavaPlugin { public void onEnable(){getLogger().info("${n} 已启动");} public void onDisable(){getLogger().info("${n} 已关闭");} }\n`,'README.md':`# ${n}\n\n- Minecraft: ${v}\n- Server: ${s}\n- Description: ${d}\n`};try{let z=new JSZip();for(let [x,y] of Object.entries(f))z.file(x,y);let b=await z.generateAsync({type:'blob'});$('download').href=URL.createObjectURL(b);$('download').download=n+'.zip';$('result').style.display='block';$('status').textContent='生成成功，共 '+Object.keys(f).length+' 个项目文件。'}catch(x){$('status').textContent='生成失败：'+x.message}finally{$('submit').disabled=false}};</script></body></html>
