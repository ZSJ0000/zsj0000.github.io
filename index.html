<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZSJ0000 导航与文件管理器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f7;color:#263238;font:14px Arial,"Microsoft YaHei",sans-serif}.wrap{max-width:980px;margin:35px auto;padding:20px}.hero,.panel{background:#fff;border-radius:14px;box-shadow:0 5px 18px #00000012;padding:24px;margin-bottom:18px}.hero{text-align:center}.hero h1{margin:0 0 8px}.hero p{color:#78909c}.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.nav a{padding:10px 16px;border-radius:8px;background:#409eff;color:white;text-decoration:none}.nav a:hover{background:#1976d2}.bar{display:flex;gap:8px;margin:12px 0}.bar button,.bar input{padding:10px;border:1px solid #d9e0e6;border-radius:7px}.bar button{background:#409eff;color:#fff;border:0;cursor:pointer}.bar button:disabled{background:#b0bec5}.bar input{flex:1}.path{background:#f5f7fa;padding:11px;border-radius:7px;margin-bottom:10px;color:#1976d2}.path span{cursor:pointer}.row{display:grid;grid-template-columns:1fr 100px 120px;gap:10px;padding:13px;border-top:1px solid #eee;align-items:center}.row:hover{background:#eef7ff}.name{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.icon{display:inline-block;width:30px;font-size:20px}.type,.action{color:#78909c;font-size:13px}.action a{color:#1976d2;margin-right:8px;text-decoration:none}.msg{text-align:center;padding:28px;color:#78909c}.status{color:#78909c;min-height:20px}@media(max-width:650px){.row{grid-template-columns:1fr 70px}.row .action{display:none}.wrap{margin:10px auto;padding:10px}}
</style>
</head>
<body><main class="wrap">
<section class="hero"><h1>ZSJ0000 文件下载</h1><p></p><nav class="nav"><a href="https://github.com/ZSJ0000/zsj0000.github.io" target="_blank">GitHub 仓库</a></nav></section>
<section class="panel"><h2>文件管理器</h2><div class="bar"><button id="back" disabled>返回</button><button id="up" disabled>上一级</button><input id="search" placeholder="搜索当前目录"></div><div id="path" class="path">/</div><div class="row" style="border:0;background:#f5f7fa;color:#78909c"><div>名称</div><div>类型</div><div>操作</div></div><div id="list"><div class="msg">正在读取仓库目录...</div></div><div id="status" class="status"></div></section>
</main><script>
(function(){var api='https://api.github.com/repos/ZSJ0000/zsj0000.github.io/contents/';var branch='main',path='',history=[],items=[],list=document.getElementById('list'),search=document.getElementById('search');function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function url(p){return api+(p?p.split('/').map(encodeURIComponent).join('/'):'')+'?ref='+branch}function size(n){if(!n)return'-';if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}function load(p,back){if(back)history.push(path);path=p;document.getElementById('status').textContent='正在读取...';var x=new XMLHttpRequest();x.open('GET',url(p));x.onload=function(){if(x.status!==200){list.innerHTML='<div class="msg">读取失败：HTTP '+x.status+'</div>';return}items=JSON.parse(x.responseText);if(!Array.isArray(items))items=[];render();document.getElementById('status').textContent='共 '+items.length+' 项'};x.onerror=function(){list.innerHTML='<div class="msg">无法连接 GitHub API</div>'};x.send()}function render(){var q=search.value.toLowerCase(),h='',count=0;document.getElementById('path').innerHTML='<span data-p="">根目录</span>'+(path?'/'+path.split('/').map(function(v,i){var p=path.split('/').slice(0,i+1).join('/');return'<span data-p="'+esc(p)+'">'+esc(v)+'</span>'}).join('/'):'');document.querySelectorAll('.path span').forEach(function(e){e.onclick=function(){history=[];search.value='';load(this.getAttribute('data-p'),false)}});items.forEach(function(it,i){if(q&&it.name.toLowerCase().indexOf(q)<0)return;count++;var dir=it.type==='dir';h+='<div class="row" data-i="'+i+'"><div class="name"><span class="icon">'+(dir?'📁':'📄')+'</span>'+esc(it.name)+'</div><div class="type">'+(dir?'文件夹':size(it.size))+'</div><div class="action">'+(dir?'打开':'<a target="_blank" href="'+esc(it.html_url||it.download_url||'#')+'">打开</a>')+'</div></div>'});list.innerHTML=count?h:'<div class="msg">当前目录没有内容</div>';document.querySelectorAll('.row[data-i]').forEach(function(r){r.onclick=function(){var it=items[+r.getAttribute('data-i')];if(it.type==='dir'){search.value='';load(it.path,true)}else if(it.html_url||it.download_url)window.open(it.html_url||it.download_url,'_blank')}});document.getElementById('back').disabled=!history.length;document.getElementById('up').disabled=!path}document.getElementById('back').onclick=function(){if(history.length)load(history.pop(),false)};document.getElementById('up').onclick=function(){if(path){var a=path.split('/');a.pop();history=[];load(a.join('/'),false)}};search.oninput=render;load('',false)})();
</script></body></html>
